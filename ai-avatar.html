<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI数字人口播工坊 · 龙虾兵团</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a1a;color:#e2e8f0;padding:0 15px 30px}
.header{text-align:center;padding:30px 15px 15px}
.header h1{font-size:1.3em;color:#00d4ff;margin-bottom:4px}
.header p{color:#718096;font-size:0.8em}
.card{background:#1a1a2e;border-radius:12px;padding:18px;margin:12px 0;border:1px solid #2d2d44}
.card h3{color:#00d4ff;font-size:0.95em;margin-bottom:10px}

/* 图片上传区 */
.upload-area{width:100%;aspect-ratio:3/4;max-height:300px;background:#2d2d44;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;margin-bottom:10px;position:relative}
.upload-area img{width:100%;height:100%;object-fit:cover}
.upload-area .empty{text-align:center;color:#718096;font-size:0.85em}
.upload-area .empty .icon{font-size:2.5em;margin-bottom:6px}

.btn-row{display:flex;gap:8px}
.btn-row button{flex:1;padding:11px;border:none;border-radius:8px;font-size:0.85em;font-weight:600;cursor:pointer}
.btn-photo{background:#2d2d44;color:#e2e8f0}
.btn-camera{background:#00d4ff22;color:#00d4ff;border:1px solid #00d4ff44}

textarea{width:100%;padding:12px;background:#2d2d44;border:1px solid #3d3d55;border-radius:8px;color:#e2e8f0;font-size:0.9em;outline:none;resize:none;min-height:80px;font-family:inherit}
textarea:focus{border-color:#00d4ff}

.voice-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.voice-row button{padding:8px 14px;background:#2d2d44;border:2px solid transparent;border-radius:8px;color:#a0aec0;font-size:0.8em;cursor:pointer}
.voice-row button.on{border-color:#00d4ff;background:#00d4ff11;color:#e2e8f0}

#genBtn{width:100%;padding:14px;border:none;border-radius:10px;font-size:1em;font-weight:700;cursor:pointer;margin-top:8px;transition:all .3s}
#genBtn.ok{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#fff}
#genBtn.no{background:#2d2d44;color:#555;cursor:not-allowed}
#genBtn.busy{background:#48bb78;color:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.7}100%{opacity:1}}

#status{text-align:center;color:#718096;font-size:0.8em;padding:5px 0;min-height:20px}
#result{display:none;text-align:center;padding:20px;background:#1a2332;border-radius:10px;margin-top:10px}
#result p{color:#48bb78;font-size:1em;margin-bottom:10px}
#result .demo-note{color:#a0aec0;font-size:0.85em;line-height:1.6;padding:15px;background:#0a0a1a;border-radius:8px;margin:10px 0}

.footer{text-align:center;padding:20px;color:#4a5568;font-size:0.75em;margin-top:30px}
</style>
</head>
<body>

<div class="header">
<h1>🎬 AI数字人口播</h1>
<p>拍一张照片 → 写文案 → 自动生成口播视频</p>
</div>

<div class="card">
<h3>📸 第一步 · 上传照片</h3>
<div class="upload-area" onclick="document.getElementById('fileInput').click()" id="uploadArea">
<div id="emptyState" class="empty">
<div class="icon">📷</div>
<p>点击选择照片</p>
<p style="font-size:0.75em;color:#4a5568;margin-top:4px">正面照效果最好</p>
</div>
<img id="preview" style="display:none">
</div>
<div class="btn-row">
<button class="btn-photo" onclick="event.stopPropagation();document.getElementById('fileInput').click()">📁 从相册选</button>
<button class="btn-camera" onclick="event.stopPropagation();document.getElementById('cameraInput').click()">📸 拍一张</button>
</div>
</div>

<div class="card">
<h3>✍️ 第二步 · 输入文案</h3>
<textarea id="scriptText" placeholder="输入想让数字人说的话...&#10;&#10;例如：大家好，欢迎关注龙虾兵团！" oninput="checkReady()"></textarea>
<h3 style="margin-top:14px">🎤 配音</h3>
<div class="voice-row">
<button class="on" onclick="pickVoice(this)">👩 晓伊·温柔</button>
<button onclick="pickVoice(this)">🧑 云健·沉稳</button>
<button onclick="pickVoice(this)">👩 婉秋·甜美</button>
<button onclick="pickVoice(this)">🧑 志刚·磁性</button>
</div>
</div>

<div class="card">
<h3>🚀 生成视频</h3>
<button id="genBtn" class="no" onclick="generate()">📷 请先上传照片</button>
<div id="status"></div>
<div id="result"></div>
</div>

<div class="footer">
<p>🦞 龙虾兵团 · AI自动化工具箱</p><div style="margin-top:15px;padding:15px;background:#1a2332;border-radius:10px;text-align:center"><p style="font-size:0.9em;color:#e2e8f0;margin-bottom:8px">💻 Windows用户一键安装</p><a href="downloads/digital-human-setup.zip" download style="display:inline-block;padding:10px 25px;background:#48bb78;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:0.9em">⬇ 下载后端工具包</a><p style="font-size:0.75em;color:#718096;margin-top:6px">下载后解压，双击setup_digital_human.py</p></div>
<p style="margin-top:4px;color:#4a5568">微信: sharing-win | 邮箱: 1059034436@qq.com</p>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">

<script>
let photoData = null;

// 监听两个input
document.getElementById('fileInput').onchange = function() { loadPhoto(this); };
document.getElementById('cameraInput').onchange = function() { loadPhoto(this); };

function loadPhoto(input) {
  var file = input.files[0];
  if (!file) return;
  
  var reader = new FileReader();
  reader.onload = function(e) {
    photoData = e.target.result;
    document.getElementById('preview').src = photoData;
    document.getElementById('preview').style.display = 'block';
    document.getElementById('emptyState').style.display = 'none';
    checkReady();
  };
  reader.readAsDataURL(file);
}

function pickVoice(btn) {
  var btns = document.querySelectorAll('.voice-row button');
  for (var i = 0; i < btns.length; i++) btns[i].className = '';
  btn.className = 'on';
}

function checkReady() {
  var btn = document.getElementById('genBtn');
  var script = document.getElementById('scriptText').value.trim();
  if (photoData && script) {
    btn.className = 'btn ok';
    btn.textContent = '🚀 生成口播视频';
  } else if (!photoData) {
    btn.className = 'btn no';
    btn.textContent = '📷 请先上传照片';
  } else {
    btn.className = 'btn no';
    btn.textContent = '✍️ 请填写文案';
  }
}

function generate() {
  var btn = document.getElementById('genBtn');
  if (btn.className.indexOf('ok') === -1 && btn.className.indexOf('busy') === -1) return;
  
  var status = document.getElementById('status');
  var result = document.getElementById('result');
  result.style.display = 'none';
  
  status.textContent = '🔍 正在识别照片...';
  btn.className = 'btn busy';
  btn.textContent = '🔍 识别中...';
  
  // 调服务器豆包API进行图片识别
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'http://192.168.1.7:5000/api/analyze-photo', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        if (data.success) {
          // 识别成功，显示分析结果
          status.textContent = '✅ 照片识别完成';
          btn.textContent = '✅ 识别完成';
          
          result.style.display = 'block';
          result.innerHTML = '<p>📸 <b>照片分析结果</b></p>'
            + '<div class="demo-note" style="text-align:left">'
            + '<p style="color:#e2e8f0;white-space:pre-wrap">' + escapeHtml(data.analysis) + '</p>'
            + '</div>'
            + '<button onclick="location.reload()" style="margin-top:10px;padding:10px 20px;background:#2d2d44;border:none;border-radius:8px;color:#e2e8f0;cursor:pointer">🔄 重新上传</button>';
          
          btn.className = 'btn ok';
          return;
        }
      } catch(e) {}
    }
    // API未就绪，进入演示模式
    demoMode();
  };
  
  xhr.onerror = function() {
    demoMode();
  };
  
  // 发送照片到服务器
  xhr.send(JSON.stringify({ photo: photoData, script: document.getElementById('scriptText').value.trim(), voice: getSelectedVoice() }));
  
  // 超时10秒没返回也进演示模式
  setTimeout(function() {
    if (btn.className.indexOf('busy') > -1) {
      xhr.abort();
      demoMode();
    }
  }, 10000);
}

function demoMode() {
  var btn = document.getElementById('genBtn');
  var status = document.getElementById('status');
  var result = document.getElementById('result');
  
  status.textContent = '';
  btn.className = 'btn ok';
  btn.textContent = '✅ 已提交';
  
  result.style.display = 'block';
  result.innerHTML = '<p>🎉 请求已提交！</p>'
    + '<div class="demo-note">'
    + '🎬 <b>演示模式</b><br><br>'
    + '豆包API图片识别引擎正在部署中...<br>'
    + '你Windows电脑到位后即可真正在线识别+生成<br><br>'
    + '📞 微信: sharing-win'
    + '</div>';
}

function getSelectedVoice() {
  var btns = document.querySelectorAll('.voice-row button');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].className === 'on') return btns[i].textContent.trim();
  }
  return '晓伊·温柔';
}

function escapeHtml(text) {
  var d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}
</script>
</body>
</html>
