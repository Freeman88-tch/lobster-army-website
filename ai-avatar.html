<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI数字人口播工坊 · 龙虾兵团</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a1a;color:#e2e8f0;padding:0 15px 30px}
.header{text-align:center;padding:30px 15px 10px}
.header h1{font-size:1.4em;color:#00d4ff}
.header p{color:#718096;font-size:0.85em;margin-top:4px}
.card{background:#1a1a2e;border-radius:14px;padding:20px;margin:14px 0;border:1px solid #2d2d44}
.card h3{color:#00d4ff;font-size:1em;margin-bottom:12px}
.upload-area{width:100%;max-width:300px;aspect-ratio:3/4;background:#2d2d44;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;margin:0 auto 12px;position:relative;border:2px dashed #3d3d55}
.upload-area img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.empty-state{text-align:center;color:#718096;padding:20px}
.empty-state .icon{font-size:3em;margin-bottom:8px}
.btn-row{display:flex;gap:10px}.btn-row button{flex:1;padding:12px;border:none;border-radius:10px;font-size:0.9em;font-weight:600;cursor:pointer}
.btn-album{background:#2d2d44;color:#e2e8f0}.btn-camera{background:#00d4ff22;color:#00d4ff;border:1px solid #00d4ff44}
textarea{width:100%;padding:14px;background:#2d2d44;border:1px solid #3d3d55;border-radius:10px;color:#e2e8f0;font-size:0.95em;outline:none;resize:none;min-height:90px;font-family:inherit}
textarea:focus{border-color:#00d4ff}
.voice-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.voice-btn{padding:10px 16px;background:#2d2d44;border:2px solid transparent;border-radius:10px;color:#a0aec0;font-size:0.85em;cursor:pointer;flex:1;text-align:center}
.voice-btn.on{border-color:#00d4ff;background:#00d4ff11;color:#e2e8f0}
#genBtn{width:100%;padding:16px;border:none;border-radius:12px;font-size:1.05em;font-weight:700;cursor:pointer;margin-top:8px;transition:all .3s}
#genBtn.ready{background:linear-gradient(135deg,#00d4ff,#0099cc);color:#fff}
#genBtn.disabled{background:#2d2d44;color:#555;cursor:not-allowed}
#genBtn.busy{background:linear-gradient(135deg,#48bb78,#38a169);color:#fff}
#status{text-align:center;color:#a0aec0;font-size:0.85em;padding:8px 0;min-height:30px}
.analysis{background:#1a2332;border:1px solid #00d4ff22;border-radius:10px;padding:15px;margin:10px 0;font-size:0.88em;color:#cbd5e0;line-height:1.6;white-space:pre-wrap;display:none}
.result{display:none;margin-top:15px;padding:20px;background:#1a2332;border:1px solid #48bb7844;border-radius:12px;text-align:center}
.result .title{color:#48bb78;font-size:1.1em;font-weight:600;margin-bottom:12px}
.result .content{background:#0a0a1a;border-radius:8px;padding:15px;text-align:left;font-size:0.85em;color:#cbd5e0;line-height:1.6;white-space:pre-wrap;margin-bottom:12px}
.dl-btn{display:inline-block;padding:14px 30px;background:linear-gradient(135deg,#48bb78,#38a169);color:#fff;border-radius:10px;font-size:1em;font-weight:700;text-decoration:none;margin:5px;box-shadow:0 4px 15px #48bb7833}
.reset-btn{display:inline-block;padding:12px 25px;background:#2d2d44;color:#a0aec0;border:none;border-radius:8px;font-size:0.9em;cursor:pointer;margin-top:10px}
.steps{display:flex;gap:8px;margin:15px 0;padding:10px;background:#0a0a1a;border-radius:10px}
.step{flex:1;text-align:center;padding:6px 4px;border-radius:8px;font-size:0.7em;color:#4a5568}
.step.active{color:#00d4ff;background:#00d4ff11}
.step.done{color:#48bb78;background:#48bb7811}
.step .num{display:block;font-size:1.3em;font-weight:700;margin-bottom:2px}
.footer{text-align:center;padding:25px;color:#4a5568;font-size:0.75em}
</style>
</head>
<body>
<div class="header"><h1>🎬 AI数字人口播工坊</h1><p>拍照 → AI分析 → 预览 → 下载</p></div>

<div class="card">
<h3>📸 上传照片</h3>
<div class="upload-area" id="upArea">
<div class="empty-state" id="empty"><div class="icon">📷</div><p>点击选择照片</p><p style="font-size:0.75em;color:#4a5568;margin-top:4px">正面照效果最好</p></div>
<img id="preview" style="display:none">
</div>
<div class="btn-row">
<button class="btn-album" id="btnAlbum">📁 从相册选</button>
<button class="btn-camera" id="btnCamera">📸 拍一张</button>
</div>
</div>

<div class="card">
<h3>✍️ 口播文案</h3>
<textarea id="scriptText" placeholder="输入想让数字人说的话...">大家好，欢迎关注龙虾兵团！我们提供AI自动化解决方案，助力企业降本增效。如需合作，欢迎联系！</textarea>
<h3 style="margin-top:14px">🎤 配音</h3>
<div class="voice-row">
<button class="voice-btn on">👩 晓伊</button>
<button class="voice-btn">🧑 云健</button>
<button class="voice-btn">👩 婉秋</button>
<button class="voice-btn">🧑 志刚</button>
</div>
</div>

<div class="card">
<h3>🚀 生成</h3>
<div class="steps">
<div class="step" id="st1"><span class="num">1</span>上传</div>
<div class="step" id="st2"><span class="num">2</span>AI分析</div>
<div class="step" id="st3"><span class="num">3</span>完成</div>
</div>
<button id="genBtn" class="disabled">📷 请先上传照片</button>
<div id="status"></div>
<div class="analysis" id="analysis"></div>
<div class="result" id="result">
<div class="title">✅ 分析完成</div>
<div class="content" id="resultContent"></div>
<a class="dl-btn" id="dlBtn" download="AI照片分析_龙虾兵团.txt">⬇ 下载分析报告</a>
<br>
<button class="reset-btn" onclick="location.reload()">🔄 重新制作</button>
</div>
</div>

<div class="footer">🦞 龙虾兵团 · AI自动化工具箱 | 微信: sharing-win</div>

<input type="file" id="f1" accept="image/*" style="display:none">
<input type="file" id="f2" accept="image/*" capture="environment" style="display:none">

<script>
var photo=null;
document.getElementById('btnAlbum').onclick=function(e){e.stopPropagation();document.getElementById('f1').click()};
document.getElementById('btnCamera').onclick=function(e){e.stopPropagation();document.getElementById('f2').click()};
document.getElementById('upArea').onclick=function(){document.getElementById('f1').click()};
document.getElementById('f1').onchange=function(){load(this)};
document.getElementById('f2').onchange=function(){load(this)};
document.getElementById('scriptText').oninput=check;

function load(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    photo=e.target.result;
    document.getElementById('preview').src=photo;
    document.getElementById('preview').style.display='block';
    document.getElementById('empty').style.display='none';
    document.getElementById('st1').className='step done';
    document.getElementById('st2').className='step active';
    check();
  };
  r.readAsDataURL(f);
}

document.querySelectorAll('.voice-btn').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.voice-btn').forEach(function(x){x.className='voice-btn'});
    this.className='voice-btn on';
  }
});

function check(){
  var btn=document.getElementById('genBtn');
  var s=document.getElementById('scriptText').value.trim();
  if(photo&&s){btn.className='btn ready';btn.textContent='🚀 AI分析 + 生成'}
  else if(!photo){btn.className='btn disabled';btn.textContent='📷 请先上传照片'}
  else{btn.className='btn disabled';btn.textContent='✍️ 请填写文案'}
}

function getVoice(){
  var a=document.querySelectorAll('.voice-btn');
  for(var i=0;i<a.length;i++)if(a[i].className=='voice-btn on')return a[i].textContent.trim();
  return '晓伊';
}

document.getElementById('genBtn').onclick=function(){
  var btn=document.getElementById('genBtn');
  if(btn.className.indexOf('ready')===-1)return;
  
  var status=document.getElementById('status');
  var analysis=document.getElementById('analysis');
  var result=document.getElementById('result');
  analysis.style.display='none';result.style.display='none';
  
  status.textContent='🔍 AI正在分析照片...';
  btn.className='btn busy';btn.textContent='🔍 分析中...';
  document.getElementById('st2').className='step active';
  
  var x=new XMLHttpRequest();
  x.open('POST','http://192.168.1.7:5000/api/analyze-photo',true);
  x.setRequestHeader('Content-Type','application/json');
  
  x.onload=function(){
    try{
      var d=JSON.parse(x.responseText);
      if(d.success){
        analysis.textContent=d.analysis;
        analysis.style.display='block';
        
        status.textContent='✅ 分析完成！';
        btn.className='btn ready';btn.textContent='✅ 已完成';
        document.getElementById('st2').className='step done';
        document.getElementById('st3').className='step active';
        
        // 显示结果区
        var content=document.getElementById('resultContent');
        content.textContent=d.analysis;
        result.style.display='block';
        analysis.style.display='none';
        
        // 绑定下载按钮
        var dl=document.getElementById('dlBtn');
        var txt='🦞 龙虾兵团 AI数字人口播工坊\n\n=== AI照片分析报告 ===\n\n'+d.analysis+'\n\n---\n生成时间: '+new Date().toLocaleString()+'\n微信: sharing-win';
        var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
        dl.href=URL.createObjectURL(blob);
        
        result.scrollIntoView({behavior:'smooth'});
        return;
      }
    }catch(e){}
    status.textContent='⚠️ 分析异常';btn.className='btn ready';btn.textContent='🔄 重试';
  };
  
  x.onerror=function(){
    status.textContent='⚠️ 连接失败，请确保电脑已启动 python server.py';
    btn.className='btn ready';btn.textContent='🔄 重试';
  };
  
  x.send(JSON.stringify({photo:photo,script:document.getElementById('scriptText').value.trim(),voice:getVoice()}));
  
  setTimeout(function(){
    if(btn.className.indexOf('busy')>-1){
      status.textContent='⏱️ 请求超时，请检查电脑后端是否运行';
      btn.className='btn ready';btn.textContent='🔄 重试';
    }
  },20000);
};
</script>
</body></html>
